services:
  source_service:
    module_path: app.repos.source
    class_name: SourceH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  citation_service:
    module_path: app.repos.citation
    class_name: CitationH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  add_source_event:
    module_path: app.events.source
    class_name: AddSource
  get_source_event:
    module_path: app.events.source
    class_name: GetSource
  list_sources_event:
    module_path: app.events.source
    class_name: ListSources
  update_source_event:
    module_path: app.events.source
    class_name: UpdateSource
  document_file_service:
    module_path: app.utils.file
    class_name: DocumentFileLoader
  attach_source_document_event:
    module_path: app.events.source
    class_name: AttachSourceDocument
  get_source_document_event:
    module_path: app.events.source
    class_name: GetSourceDocument
  download_source_document_event:
    module_path: app.events.source
    class_name: DownloadSourceDocument
  add_citation_event:
    module_path: app.events.citation
    class_name: AddCitation
  get_citation_event:
    module_path: app.events.citation
    class_name: GetCitation
  list_citations_for_source_event:
    module_path: app.events.citation
    class_name: ListCitationsForSource
  update_citation_event:
    module_path: app.events.citation
    class_name: UpdateCitation
  citation_style_service:
    module_path: app.repos.citation_style
    class_name: CitationStyleConfigRepository
    parameters:
      citation_style_config: app/assets/citation_styles.yml
  render_citation_event:
    module_path: app.events.citation_style
    class_name: RenderCitation
  theme_service:
    module_path: app.repos.theme
    class_name: ThemeH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  linkage_service:
    module_path: app.repos.linkage
    class_name: LinkageH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  theme_synthesis_service:
    module_path: app.utils.synthesis
    class_name: NaiveThemeSynthesizer
  add_theme_event:
    module_path: app.events.theme
    class_name: AddTheme
  get_theme_event:
    module_path: app.events.theme
    class_name: GetTheme
  list_themes_event:
    module_path: app.events.theme
    class_name: ListThemes
  list_linkages_for_theme_event:
    module_path: app.events.theme
    class_name: ListLinkagesForTheme
  link_citation_to_theme_event:
    module_path: app.events.theme
    class_name: LinkCitationToTheme
  update_theme_event:
    module_path: app.events.theme
    class_name: UpdateTheme
  resynthesize_theme_event:
    module_path: app.events.theme
    class_name: ResynthesizeTheme
  show_theme_event:
    module_path: app.events.theme
    class_name: ShowTheme
  abstract_service:
    module_path: app.repos.abstract
    class_name: AbstractH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  abstract_theme_service:
    module_path: app.repos.abstract_theme
    class_name: AbstractThemeH5Repository
    parameters:
      h5_file: .lit_review/lit_review.h5
  abstract_synthesis_service:
    module_path: app.utils.synthesis
    class_name: NaiveAbstractSynthesizer
  add_abstract_event:
    module_path: app.events.abstract
    class_name: AddAbstract
  get_abstract_event:
    module_path: app.events.abstract
    class_name: GetAbstract
  list_abstracts_event:
    module_path: app.events.abstract
    class_name: ListAbstracts
  list_abstract_themes_event:
    module_path: app.events.abstract
    class_name: ListAbstractThemes
  link_theme_to_abstract_event:
    module_path: app.events.abstract
    class_name: LinkThemeToAbstract
  update_abstract_event:
    module_path: app.events.abstract
    class_name: UpdateAbstract
  synthesize_abstract_event:
    module_path: app.events.abstract
    class_name: SynthesizeAbstract
  show_abstract_event:
    module_path: app.events.abstract
    class_name: ShowAbstract
