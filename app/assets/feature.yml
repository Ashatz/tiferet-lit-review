features:
  source:
    add:
      name: Add Source
      steps:
        - name: Add Source
          service_id: add_source_event
          params:
            source_medium: $r.medium
    list:
      name: List Sources
      steps:
        - name: List Sources
          service_id: list_sources_event
    update:
      name: Update Source
      steps:
        - name: Update Source
          service_id: update_source_event
  citation:
    add:
      name: Add Citation
      steps:
        - name: Add Citation
          service_id: add_citation_event
    list:
      name: List Citations
      steps:
        - name: List Citations
          service_id: list_citations_for_source_event
    update:
      name: Update Citation
      steps:
        - name: Update Citation
          service_id: update_citation_event
    render:
      name: Render Citation
      steps:
        - name: Render Citation
          service_id: render_citation_event
          params:
            citation_id: $r.id
            style_id: $r.style
  theme:
    add:
      name: Add Theme
      steps:
        - name: Add Theme
          service_id: add_theme_event
    list:
      name: List Themes
      steps:
        - name: List Themes
          service_id: list_themes_event
    link:
      name: Link Citation To Theme
      steps:
        - name: Link Citation To Theme
          service_id: link_citation_to_theme_event
    show:
      name: Show Theme
      steps:
        - name: Show Theme
          service_id: show_theme_event
