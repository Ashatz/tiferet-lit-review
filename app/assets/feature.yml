features:
  source:
    add:
      name: Add Source
      steps:
        - name: Add Source
          service_id: add_source_event
          params:
            source_medium: $r.medium
    list:
      name: List Sources
      steps:
        - name: List Sources
          service_id: list_sources_event
    update:
      name: Update Source
      steps:
        - name: Update Source
          service_id: update_source_event
    attach:
      name: Attach Source Document
      steps:
        - name: Attach Source Document
          service_id: attach_source_document_event
          params:
            source_id: $r.id
            path: $r.file
            document_name: $r.name
    download:
      name: Download Source Document
      steps:
        - name: Download Source Document
          service_id: download_source_document_event
          params:
            source_id: $r.id
            out: $r.out
  citation:
    add:
      name: Add Citation
      steps:
        - name: Add Citation
          service_id: add_citation_event
    list:
      name: List Citations
      steps:
        - name: List Citations
          service_id: list_citations_for_source_event
    update:
      name: Update Citation
      steps:
        - name: Update Citation
          service_id: update_citation_event
    render:
      name: Render Citation
      steps:
        - name: Render Citation
          service_id: render_citation_event
          params:
            citation_id: $r.id
            style_id: $r.style
  theme:
    add:
      name: Add Theme
      steps:
        - name: Add Theme
          service_id: add_theme_event
    list:
      name: List Themes
      steps:
        - name: List Themes
          service_id: list_themes_event
    link:
      name: Link Citation To Theme
      steps:
        - name: Link Citation To Theme
          service_id: link_citation_to_theme_event
    update:
      name: Update Theme
      steps:
        - name: Update Theme
          service_id: update_theme_event
    synthesize:
      name: Synthesize Theme
      steps:
        - name: Synthesize Theme
          service_id: resynthesize_theme_event
    retire:
      name: Retire Linkage
      steps:
        - name: Retire Linkage
          service_id: retire_linkage_event
    reinstate:
      name: Reinstate Linkage
      steps:
        - name: Reinstate Linkage
          service_id: reinstate_linkage_event
    show:
      name: Show Theme
      steps:
        - name: Show Theme
          service_id: show_theme_event
  abstract:
    add:
      name: Add Abstract
      steps:
        - name: Add Abstract
          service_id: add_abstract_event
    list:
      name: List Abstracts
      steps:
        - name: List Abstracts
          service_id: list_abstracts_event
    show:
      name: Show Abstract
      steps:
        - name: Show Abstract
          service_id: show_abstract_event
    update:
      name: Update Abstract
      steps:
        - name: Update Abstract
          service_id: update_abstract_event
    link:
      name: Link Theme To Abstract
      steps:
        - name: Link Theme To Abstract
          service_id: link_theme_to_abstract_event
    synthesize:
      name: Synthesize Abstract
      steps:
        - name: Synthesize Abstract
          service_id: synthesize_abstract_event
  outline:
    assemble:
      name: Assemble Outline
      steps:
        - name: Assemble Outline
          service_id: assemble_outline_event
          params:
            style_id: $r.style
    add:
      name: Add Outline Slot
      steps:
        - name: Add Outline Slot
          service_id: add_outline_slot_event
    add-theme:
      name: Add Outline Slot Theme
      steps:
        - name: Add Outline Slot Theme
          service_id: add_outline_slot_theme_event
          params:
            slot_id: $r.slot_id
    remove-theme:
      name: Remove Outline Slot Theme
      steps:
        - name: Remove Outline Slot Theme
          service_id: remove_outline_slot_theme_event
          params:
            slot_id: $r.slot_id
    show:
      name: Show Outline
      steps:
        - name: Show Outline
          service_id: show_outline_event
          params:
            style_id: $r.style
    list:
      name: List Outlines
      steps:
        - name: List Outlines
          service_id: list_outlines_event
  paper:
    open:
      name: Open Paper From Outline
      steps:
        - name: Open Paper From Outline
          service_id: open_paper_from_outline_event
    show:
      name: Show Paper
      steps:
        - name: Show Paper
          service_id: show_paper_event
    list:
      name: List Papers
      steps:
        - name: List Papers
          service_id: list_papers_event
    section:
      name: Update Paper Section
      steps:
        - name: Update Paper Section
          service_id: update_paper_section_event
          params:
            section_id: $r.section
    abstract:
      name: Set Paper Abstract
      steps:
        - name: Set Paper Abstract
          service_id: set_paper_abstract_event
          params:
            abstract_id: $r.from_abstract
    cite:
      name: Add Paper Citation
      steps:
        - name: Add Paper Citation
          service_id: add_paper_citation_event
          params:
            section_id: $r.section
