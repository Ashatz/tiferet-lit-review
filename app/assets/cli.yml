cli:
  cmds:
    source:
      add:
        name: Add Source
        key: add
        group_key: source
        args:
          - name_or_flags: ["-m", "--medium"]
            required: true
            description: "The source medium (e.g. pdf, book)."
          - name_or_flags: ["-a", "--authors"]
            type: list
            required: true
            description: "The source authors (space-separated)."
          - name_or_flags: ["-y", "--year"]
            type: int
            required: true
            description: "The source publication year."
          - name_or_flags: ["-t", "--title"]
            required: true
            description: "The source title."
          - name_or_flags: ["--container-title"]
            required: false
            description: "The journal or collection title, where applicable."
          - name_or_flags: ["--publisher"]
            required: false
            description: "The source publisher, where applicable."
      list:
        name: List Sources
        key: list
        group_key: source
      update:
        name: Update Source
        key: update
        group_key: source
        args:
          - name_or_flags: ["id"]
            description: "The source identifier to update."
          - name_or_flags: ["-a", "--authors"]
            type: list
            required: false
            description: "The updated source authors (space-separated)."
          - name_or_flags: ["-y", "--year"]
            type: int
            required: false
            description: "The updated source publication year."
          - name_or_flags: ["-t", "--title"]
            required: false
            description: "The updated source title."
          - name_or_flags: ["--container-title"]
            required: false
            description: "The updated journal or collection title."
          - name_or_flags: ["--publisher"]
            required: false
            description: "The updated source publisher."
      attach:
        name: Attach Source Document
        key: attach
        group_key: source
        args:
          - name_or_flags: ["id"]
            description: "The source identifier to attach a document to."
          - name_or_flags: ["-f", "--file"]
            required: true
            description: "Path to the file being uploaded."
          - name_or_flags: ["-n", "--name"]
            required: false
            description: "Optional API / download name override."
      download:
        name: Download Source Document
        key: download
        group_key: source
        args:
          - name_or_flags: ["id"]
            description: "The source identifier whose document to download."
          - name_or_flags: ["-o", "--out"]
            required: false
            description: "Destination directory; defaults to the current working directory."
    citation:
      add:
        name: Add Citation
        key: add
        group_key: citation
        args:
          - name_or_flags: ["-s", "--source-id"]
            required: true
            description: "The identifier of the source this citation was pulled from."
          - name_or_flags: ["-l", "--locator"]
            required: true
            description: "The precise locator of the excerpt within its source."
          - name_or_flags: ["-e", "--excerpt"]
            required: true
            description: "The quoted or paraphrased text pulled from the source."
          - name_or_flags: ["--context-note"]
            required: false
            description: "An optional note describing the excerpt's surrounding context."
      list:
        name: List Citations
        key: list
        group_key: citation
        args:
          - name_or_flags: ["-s", "--source-id"]
            required: true
            description: "The source identifier to filter citations by."
      update:
        name: Update Citation
        key: update
        group_key: citation
        args:
          - name_or_flags: ["id"]
            description: "The citation identifier to update."
          - name_or_flags: ["-l", "--locator"]
            required: false
            description: "The updated locator of the excerpt within its source."
          - name_or_flags: ["-e", "--excerpt"]
            required: false
            description: "The updated quoted or paraphrased text."
          - name_or_flags: ["--context-note"]
            required: false
            description: "The updated surrounding-context note."
      render:
        name: Render Citation
        key: render
        group_key: citation
        args:
          - name_or_flags: ["id"]
            description: "The citation identifier to render."
          - name_or_flags: ["-s", "--style"]
            required: true
            description: "The citation style identifier (e.g. apa)."
    theme:
      add:
        name: Add Theme
        key: add
        group_key: theme
        args:
          - name_or_flags: ["-n", "--name"]
            required: true
            description: "The short label for the theme."
      list:
        name: List Themes
        key: list
        group_key: theme
      link:
        name: Link Citation To Theme
        key: link
        group_key: theme
        args:
          - name_or_flags: ["-c", "--citation-id"]
            required: true
            description: "The citation identifier to link."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier to link the citation to."
          - name_or_flags: ["-s", "--include-synthesis"]
            type: bool
            required: false
            description: "Also re-synthesize the theme from its full linkage set."
      update:
        name: Update Theme
        key: update
        group_key: theme
        args:
          - name_or_flags: ["id"]
            description: "The theme identifier to update."
          - name_or_flags: ["-n", "--name"]
            required: false
            description: "The updated theme name."
          - name_or_flags: ["-d", "--description"]
            required: false
            description: "The editorial synthesized description."
      synthesize:
        name: Synthesize Theme
        key: synthesize
        group_key: theme
        args:
          - name_or_flags: ["id"]
            description: "The theme identifier to re-synthesize."
      retire:
        name: Retire Linkage
        key: retire
        group_key: theme
        args:
          - name_or_flags: ["-c", "--citation-id"]
            required: true
            description: "The citation identifier whose linkage to retire."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier whose linkage to retire."
          - name_or_flags: ["-r", "--reason"]
            required: false
            description: "Optional free-text reason for the retirement."
      reinstate:
        name: Reinstate Linkage
        key: reinstate
        group_key: theme
        args:
          - name_or_flags: ["-c", "--citation-id"]
            required: true
            description: "The citation identifier whose linkage to reinstate."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier whose linkage to reinstate."
      show:
        name: Show Theme
        key: show
        group_key: theme
        args:
          - name_or_flags: ["id"]
            description: "The theme identifier to show."
          - name_or_flags: ["--include-retired"]
            type: bool
            required: false
            description: "Also list retired linkages with their retirement timestamp and reason."
    abstract:
      add:
        name: Add Abstract
        key: add
        group_key: abstract
        args:
          - name_or_flags: ["-n", "--name"]
            required: true
            description: "The short label for the argument brief."
          - name_or_flags: ["-d", "--body"]
            required: false
            description: "Optional initial body text."
      list:
        name: List Abstracts
        key: list
        group_key: abstract
      show:
        name: Show Abstract
        key: show
        group_key: abstract
        args:
          - name_or_flags: ["id"]
            description: "The abstract identifier to show."
      update:
        name: Update Abstract
        key: update
        group_key: abstract
        args:
          - name_or_flags: ["id"]
            description: "The abstract identifier to update."
          - name_or_flags: ["-n", "--name"]
            required: false
            description: "The updated abstract name."
          - name_or_flags: ["-d", "--body"]
            required: false
            description: "The editorial abstract body."
      link:
        name: Link Theme To Abstract
        key: link
        group_key: abstract
        args:
          - name_or_flags: ["id"]
            description: "The abstract identifier to link a theme to."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier to include in the abstract."
          - name_or_flags: ["-s", "--include-synthesis"]
            type: bool
            required: false
            description: "Also re-synthesize the abstract from its full theme set."
      synthesize:
        name: Synthesize Abstract
        key: synthesize
        group_key: abstract
        args:
          - name_or_flags: ["id"]
            description: "The abstract identifier to re-synthesize."
    outline:
      assemble:
        name: Assemble Outline
        key: assemble
        group_key: outline
        args:
          - name_or_flags: ["-n", "--title"]
            required: true
            description: "The short label for this arrangement."
          - name_or_flags: ["-s", "--style"]
            required: false
            description: "Optional citation style for later preview; unused to persist the outline."
      add:
        name: Add Outline Slot
        key: add
        group_key: outline
        args:
          - name_or_flags: ["id"]
            description: "The outline identifier to add a slot to."
          - name_or_flags: ["-n", "--title"]
            required: true
            description: "The human heading for this grouping."
          - name_or_flags: ["-t", "--theme-ids"]
            type: list
            required: false
            description: "Optional theme identifiers to include in the slot (space-separated)."
      add-theme:
        name: Add Outline Slot Theme
        key: add-theme
        group_key: outline
        args:
          - name_or_flags: ["id"]
            description: "The outline identifier whose slot to update."
          - name_or_flags: ["-s", "--slot-id"]
            required: true
            description: "The slot identifier to add a theme to."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier to include in the slot."
      remove-theme:
        name: Remove Outline Slot Theme
        key: remove-theme
        group_key: outline
        args:
          - name_or_flags: ["id"]
            description: "The outline identifier whose slot to update."
          - name_or_flags: ["-s", "--slot-id"]
            required: true
            description: "The slot identifier to remove a theme from."
          - name_or_flags: ["-t", "--theme-id"]
            required: true
            description: "The theme identifier to remove from the slot."
      show:
        name: Show Outline
        key: show
        group_key: outline
        args:
          - name_or_flags: ["id"]
            description: "The outline identifier to show."
          - name_or_flags: ["-s", "--style"]
            required: false
            description: "Optional citation style for live citation preview."
      list:
        name: List Outlines
        key: list
        group_key: outline
    paper:
      open:
        name: Open Paper From Outline
        key: open
        group_key: paper
        args:
          - name_or_flags: ["outline_id"]
            description: "The origin outline identifier to fork into a paper."
          - name_or_flags: ["-n", "--title"]
            required: false
            description: "Optional manuscript title; defaults to the outline title."
      show:
        name: Show Paper
        key: show
        group_key: paper
        args:
          - name_or_flags: ["id"]
            description: "The paper identifier to show."
      list:
        name: List Papers
        key: list
        group_key: paper
      section:
        name: Update Paper Section
        key: section
        group_key: paper
        args:
          - name_or_flags: ["id"]
            description: "The paper identifier whose section to update."
          - name_or_flags: ["-s", "--section"]
            required: true
            description: "The section identifier to update."
          - name_or_flags: ["--content"]
            required: false
            description: "The drafted section prose."
          - name_or_flags: ["--context"]
            required: false
            description: "Why this section exists / why it was drafted this way."
          - name_or_flags: ["--title"]
            required: false
            description: "The updated section heading."
      abstract:
        name: Set Paper Abstract
        key: abstract
        group_key: paper
        args:
          - name_or_flags: ["id"]
            description: "The paper identifier whose abstract to set."
          - name_or_flags: ["-d", "--body"]
            required: false
            description: "The editorial paper brief."
          - name_or_flags: ["--from-abstract"]
            required: false
            description: "Optional KB Abstract identifier to copy from."
      cite:
        name: Add Paper Citation
        key: cite
        group_key: paper
        args:
          - name_or_flags: ["id"]
            description: "The paper identifier to add a citation to."
          - name_or_flags: ["-c", "--citation-id"]
            required: true
            description: "The KB citation identifier used in this manuscript."
          - name_or_flags: ["-s", "--section"]
            required: false
            description: "Optional paper section this citation is used in."
